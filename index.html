<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkateXP - Level Up Your Sessions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">SKATE<span class="xp">XP</span></h1>
            <div class="header-right">
                <div class="user-level">LVL ?</div>
                <a class="login-btn-header" href="login.html">User</a> <!--Temporary login button to link-->
            </div>
        </header>

        <!-- Main Stats Section -->
        <section class="stats-grid">
            <div class="stat-card streak">
                <div class="stat-number">?</div>
                <div class="stat-label">DAY STREAK</div>
                <div class="streak-fire"></div>
            </div>
            
            <div class="stat-card xp-card">
                <div class="stat-number">?</div>
                <div class="stat-label">TOTAL XP</div>
                <div class="xp-bar">
                    <div class="xp-progress"></div>
                </div>
                <div class="xp-details">Next level: ? XP</div>
            </div>
        </section>

        <!-- Session Logger -->
        <section class="session-section"> 
            <button class="session-btn">
                <span class="btn-icon">🛹</span>
                I SKATED TODAY
            </button>
            <p class="last-session">Last session: ? hours ago</p>
        </section>

        <!-- Tricks Tracker -->
        <section class="tricks-section">
            <div class="section-header">
                <h2 class="section-title">TRICK PROGRESS</h2>
                <button class="add-trick-btn" id="addTrickBtn">+ ADD TRICK</button>
            </div>
            
            <!-- Add Trick Form And Tricks Section -->
            <div id="addTrickForm" class="add-trick-form">
                <input type="text" class="trick-input" name="tricks" placeholder="Enter trick name (e.g., Kickflip)">
                <div class="form-buttons">
                    <button class="save-btn" id="save-btn">SAVE</button>
                    <button class="cancel-btn">CANCEL</button>
                </div>
            </div>
            
            <div class="tricks-grid">
            </div>
        </section>

        <!-- Achievements -->
        <section class="achievements-section">
            <div class="section-header">
                <h2 class="section-title">RECENT BADGES</h2>
                <a href="badges.html" class="info-btn" title="View badge information">ℹ️</a>
            </div>
            <div class="badges-grid">
                <div class="badge locked">
                    <div class="badge-icon">🏆</div>
                    <div class="badge-name">WEEK WARRIOR</div>
                </div>
                <div class="badge locked">
                    <div class="badge-icon">⚡</div>
                    <div class="badge-name">SPEED DEMON</div>
                </div>
                <div class="badge locked">
                    <div class="badge-icon">👑</div>
                    <div class="badge-name">STREET KING</div>
                </div>
            </div>
        </section>
    </div>

    <div id="confirmDialog" class="confirm-dialog hidden">
        <div class="confirm-dialog-overlay"></div>
        <div class="confirm-dialog-box">
            <div class="confirm-dialog-header">Confirm?</div>
            <div id="confirmMessage" class="confirm-dialog-message">Are you sure?</div>
            <div class="confirm-dialog-actions">
                <button id="confirmYesBtn" class="confirm-yes-btn">Yes</button>
                <button id="confirmNoBtn" class="confirm-no-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="undoSnackbar" class="undo-snackbar hidden">
        <span id="undoSnackbarMessage">Trick deleted.</span>
        <button id="undoBtn" class="undo-btn">UNDO</button>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <a class="learn-tricks-btn" href="https://0414231012.github.io/cs1-Final-Website-Project/index.html" target="_blank" title="Learn skateboarding tricks">📚 LEARN TRICKS</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
